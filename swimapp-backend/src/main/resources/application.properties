#DB Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATASOURCE_USERNAME}
quarkus.datasource.password=${DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.url=${DATASOURCE_URL}
quarkus.hibernate-orm.schema-management.strategy=validate

#Flyway
quarkus.flyway.migrate-at-start=true

#Swagger-UI
quarkus.smallrye-openapi.info-title=SwimApp
quarkus.smallrye-openapi.info-description=Swimming Management System
quarkus.smallrye-openapi.security-scheme=oidc
quarkus.smallrye-openapi.security-scheme-name=Keycloak
quarkus.smallrye-openapi.oidc-open-id-connect-url=${SMALLRYE_OPENAPI_CONNECT_URL}

#Keycloak & OIDC
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.keycloak.policy-enforce.enabled=true
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_ADMIN_CLIENT_SERVER_URL}
quarkus.keycloak.admin-client.realm=${KEYCLOAK_ADMIN_CLIENT_REALM}
quarkus.keycloak.admin-client.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
quarkus.keycloak.admin-client.username=${KEYCLOAK_ADMIN_CLIENT_USERNAME}
quarkus.keycloak.admin-client.password=${KEYCLOAK_ADMIN_CLIENT_PASSWORD}
quarkus.keycloak.admin-client.grant-type=PASSWORD

#CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,DELETE,PUT,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=true
