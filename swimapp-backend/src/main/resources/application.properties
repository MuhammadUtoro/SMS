#DB Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=mysecretpassword
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/swimapp
quarkus.hibernate-orm.schema-management.strategy=validate

#Flyway
quarkus.flyway.migrate-at-start=true

#Swagger-UI
quarkus.smallrye-openapi.info-title=SwimApp
quarkus.smallrye-openapi.info-description=Swimming Management System
quarkus.smallrye-openapi.security-scheme=oidc
quarkus.smallrye-openapi.security-scheme-name=Keycloak
quarkus.smallrye-openapi.oidc-open-id-connect-url=http://localhost:8081/realms/dio-project/.well-known/openid-configuration

#Keycloak & OIDC
quarkus.oidc.auth-server-url=http://localhost:8081/realms/dio-project
quarkus.oidc.client-id=swimapp
quarkus.keycloak.policy-enforce.enabled=true
quarkus.keycloak.admin-client.server-url=http://localhost:8081
quarkus.keycloak.admin-client.realm=dio-project
quarkus.keycloak.admin-client.client-id=swimapp
quarkus.keycloak.admin-client.username=admin
quarkus.keycloak.admin-client.password=admin
quarkus.keycloak.admin-client.grant-type=PASSWORD

#CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,DELETE,PUT,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=true
