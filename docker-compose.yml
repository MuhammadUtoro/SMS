services:
 
  swimapp-postgres:
    image: postgres:18
    container_name: swimapp-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: swimapp
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.data
      - ./db:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swimapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  postgres-keycloak:
    image: postgres:18
    container_name: postgres-keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - pgdata_keycloak:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    image: keycloak/keycloak:latest
    container_name: swimapp-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://192.168.0.126:8443/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import
    healthcheck:
      test:
        - "CMD-SHELL"
        - >- 
          exec 3<>/dev/tcp/localhost/9000;
          echo -e 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          cat <&3 | grep -q '\"status\": \"UP\"' 
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  swimapp-backend:
    build:
      context: swimapp-backend/
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: swimapp-backend
    ports:
      - "8080:8080"
    env_file:
      - swimapp-backend/.env
    depends_on:
      swimapp-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  
  swimapp-frontend:
    build:
      context: ./swimapp-frontend
      dockerfile: Dockerfile
    volumes:
      - /home/dio/Documents/swimapp/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /home/dio/Documents/swimapp/privateKey.pem:/etc/nginx/ssl/privateKey.pem:ro
    ports:
      - "8083:80"
      - "8443:443"

volumes:
  pgdata:
  pgdata_keycloak:
