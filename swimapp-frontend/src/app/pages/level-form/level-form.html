<div class="create-level-container">
<mat-card class="create-card" appearance="raised">
  <mat-card-header>
    <mat-card-title>Swimming Management System</mat-card-title>
  <mat-card-subtitle>Create New Level</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>Level Name</mat-label>
        <input matInput formControlName="levelName" />
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button matButton="tonal" (click)=createLevel()>Submit
    </button>
  </mat-card-actions>
</mat-card>
</div>
