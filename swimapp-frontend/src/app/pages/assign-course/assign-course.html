<main class="assign-course-container">
  <mat-card class="assign-course-card">
    <mat-card-header>
      <mat-card-title>Assign Course</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form">
        <mat-form-field appearance="outline">
          <mat-label>Course Name</mat-label>
          <mat-select formControlName="courseId">
            @for (course of courses(); track course.courseId) {
              <mat-option [value]="course.courseId">
                {{ course.courseId }}: {{ course.courseName }}, {{ course.courseDay }}, {{ course.courseTime }}.
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      @if (swimmerDetails(); as swimmer) {
        <button matButton="tonal" (click)="assignCourse(swimmer.swimmerId)">Assign</button>
      }
    </mat-card-actions>
  </mat-card>
</main>
