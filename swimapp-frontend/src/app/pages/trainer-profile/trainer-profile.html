<main class="profile-page">
  <header class="page-header">
    <h1>My Profile</h1>
    <p class="page-description">
      Update your personal info
    </p>
  </header>

  <section class="profile-content">
    <mat-card class="profile-card" appearance="outlined">
      <mat-card-header>
        <div mat-card-avatar class="profile-avatar">
          {{ trainer()?.firstName?.charAt(0)}}
        </div>
        <mat-card-title> {{ trainer()?.firstName }} {{ trainer()?.lastName }} </mat-card-title>
        <mat-card-subtitle>Trainer account</mat-card-subtitle>
      </mat-card-header>

      <mat-divider></mat-divider>
      <mat-card-content>
        <section class="profile-section">
          <h2 id="profile-heading">Personal Information </h2>
          <dl class="profile-grid">
            <div class="profile-field">
              <dt>First Name</dt>
              <dd>{{ trainer()?.firstName }}
            </div>

            <div class="profile-field">
              <dt>Last Name</dt>
              <dd>{{ trainer()?.lastName }}
            </div>

            <div class="profile-field">
              <dt>Trainer ID</dt>
              <dd>{{ trainer()?.trainerId }}
            </div>
          </dl>
        </section>
      </mat-card-content>

      <mat-divider></mat-divider>

      <mat-card-actions class="profile-actions">
       <button matButton="tonal" routerLink='/trainers/me/edit'>
        Edit profile
       </button>
      </mat-card-actions>

    </mat-card>
  </section>
</main>
