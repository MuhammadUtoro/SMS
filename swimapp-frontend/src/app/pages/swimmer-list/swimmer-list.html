<main class="swimmer-list-container">
  @for (swimmer of swimmers(); track swimmer.swimmerId) {
  <ul>
    <li>
      {{ swimmer.swimmerId }}: {{ swimmer.firstName }} {{ swimmer.lastName }}:
      {{ swimmer.courseName }}
      <a class="view-details" [routerLink]="['/swimmers', swimmer.swimmerId]">View details</a>
    </li>
  </ul>
  }
</main>
