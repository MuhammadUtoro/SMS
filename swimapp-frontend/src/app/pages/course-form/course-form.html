<div class="create-course-container">
  <mat-card class="create-card" appearance="raised">
    <mat-card-header>
      <mat-card-title>Swimming Management System</mat-card-title>
      <mat-card-subtitle>Create New Course</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
     <form [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>Trainer</mat-label>
        <mat-select formControlName="trainerId">
          @for (trainer of trainers; track trainer.trainerId) {
          <mat-option [value]="trainer.trainerId">
            {{ trainer.firstName }} {{ trainer.lastName }}
          </mat-option>
          }
        </mat-select>
      </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Level Id</mat-label>
          <input matInput formControlName="levelId"/>
        </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Select Day</mat-label>
        <mat-select>
          @for (day of days; track day) {
            <mat-option [value]="day">{{ day }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Pick a time</mat-label>
        <input matInput formControlName="courseTime" [matTimepicker]="picker">
        <mat-timepicker-toggle matIconSuffix [for]="picker"></mat-timepicker-toggle>
        <mat-timepicker #picker />
      </mat-form-field>
     </form>
    </mat-card-content>
  </mat-card>
</div>
