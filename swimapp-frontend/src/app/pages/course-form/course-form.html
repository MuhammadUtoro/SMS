<div class="create-course-container">
  <mat-card class="create-card">
    <mat-card-header>
      <mat-card-title>Swimming Management System</mat-card-title>
      <mat-card-subtitle>Create New Course</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
     <form [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>Select Day</mat-label>
        <mat-select>
          @for (day of days; track day) {
            <mat-option [value]="day">{{ day }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
     </form>
    </mat-card-content>
  </mat-card>
</div>
