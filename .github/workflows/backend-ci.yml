name: Backend CI

on:
  push:
    branches:
      - main
    paths: 
      - 'swimapp-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYCLOAK_ADMIN_CLIENT_REALM: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_REALM }}
      KEYCLOAK_ADMIN_CLIENT_ID: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Build Quarkus Backend
        working-directory: swimapp-backend
        run: ./mvnw package
