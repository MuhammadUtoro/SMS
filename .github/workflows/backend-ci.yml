name: Backend CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Build Quarkus Backend
        working-directory: swimapp-backend
        run: ./mvnw package
